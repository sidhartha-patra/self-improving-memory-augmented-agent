[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "self-improving-memory-augmented-agent"
version = "0.1.0"
description = "A production-oriented local agent harness with approvals, safety controls, and deterministic evals."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sidhartha Patra" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
self-improving-memory-augmented-agent = "self_improving_memory_augmented_agent.cli:main"
self-improving-memory-augmented-agent-evals = "self_improving_memory_augmented_agent.evals:main"

[tool.hatch.build.targets.wheel]
packages = ["src/self_improving_memory_augmented_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/self_improving_memory_augmented_agent", "README.md", "docs", "evals", "scripts", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["self_improving_memory_augmented_agent"]

